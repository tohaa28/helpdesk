pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}

def prepScript = new File(settingsDir, "printcheck-build/prepare_alpha9.py")
def prep = new ProcessBuilder("python3", prepScript.absolutePath, settingsDir.absolutePath)
        .directory(settingsDir)
        .inheritIO()
        .start()
int prepCode = prep.waitFor()
if (prepCode != 0) {
    throw new GradleException("PrintCheck alpha9 source preparation failed: " + prepCode)
}

rootProject.name = "PrintCheckAndroid"
include ':app'
project(':app').projectDir = new File(settingsDir, ".printcheck-alpha9/app")
