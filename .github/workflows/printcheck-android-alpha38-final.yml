name: Build PrintCheck 3.4.0-alpha38 FINAL signed APK
on:
  push:
    branches: [printcheck-build-3.4.0-alpha38]
    paths: ['printcheck-build/ALPHA38_FINAL_TRIGGER.txt']
  workflow_dispatch:
concurrency:
  group: printcheck-alpha38-final
  cancel-in-progress: true
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prepare alpha38
        run: python3 printcheck-build/prepare_alpha38.py .
      - name: Verify alpha38 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha38'" .printcheck-alpha38/app/build.gradle
          grep -q "versionCode 340038" .printcheck-alpha38/app/build.gradle
          grep -q 'per-color-medial-gap-v5-stable-width-path' .printcheck-alpha38/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q 'widerSupportAhead' .printcheck-alpha38/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q 'small_elements_per_color_medial_v6_stable_width_path' .printcheck-alpha38/app/src/main/java/ru/printcheck/android/MainActivity.java
      - name: Alpha38 audit
        run: python3 .printcheck-alpha38/tests/audit_alpha38.py
      - name: Core tests
        run: bash .printcheck-alpha38/tests/run_core.sh
      - name: Build
        working-directory: .printcheck-alpha38
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha38/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha38_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha38_SIGNER.txt
      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha38/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha38.apk
          cd .printcheck-alpha38
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha38_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha38.apk PrintCheck_Android_3.4.0-alpha38_source.zip | tee PrintCheck_Android_3.4.0-alpha38_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha38_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha38.apk
            PrintCheck_Android_3.4.0-alpha38_source.zip
            PrintCheck_Android_3.4.0-alpha38_SHA256.txt
            PrintCheck_Android_3.4.0-alpha38_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
