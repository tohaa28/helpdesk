name: Build PrintCheck 3.4.0-alpha25 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha25
    paths:
      - 'printcheck-build/ALPHA25_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha25-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha25
        run: python3 printcheck-build/prepare_alpha25.py .

      - name: Verify alpha25 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha25'" .printcheck-alpha25/app/build.gradle
          grep -q "versionCode 340025" .printcheck-alpha25/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha25/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha25/app/build.gradle
          test -f .printcheck-alpha25/app/src/main/java/ru/printcheck/android/ArtworkColorLayerLogic.java
          grep -q "visible-color-separations-v1-background-ray" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/ArtworkColorLayerLogic.java
          grep -q "analyzeColorLayers" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "negativeSameColor" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "singleObjects" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "cross_color_negative_gaps_ignored" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "color_layers" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "colors.layers.size()>8" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "reference_ruler" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "ARTWORK_TARGET_DPI = 720" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "MAX_ARTWORK_PIXELS = 4_000_000L" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          ! grep -q "analyzeCalibrated(hi.mask" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          ! grep -q "analyzeCalibrated(mask.mask" .printcheck-alpha25/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java

      - name: Alpha25 audit
        run: python3 .printcheck-alpha25/tests/audit_alpha25.py

      - name: Core tests
        run: bash .printcheck-alpha25/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha25
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha25/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha25_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha25_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha25/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha25.apk
          cd .printcheck-alpha25
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha25_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha25.apk PrintCheck_Android_3.4.0-alpha25_source.zip | tee PrintCheck_Android_3.4.0-alpha25_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha25_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha25.apk
            PrintCheck_Android_3.4.0-alpha25_source.zip
            PrintCheck_Android_3.4.0-alpha25_SHA256.txt
            PrintCheck_Android_3.4.0-alpha25_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
