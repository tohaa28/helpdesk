name: Build PrintCheck 3.3 APK

on:
  push:
    branches:
      - printcheck-build-3.3.0-alpha1
    paths:
      - 'printcheck-build/**'
      - '.github/workflows/printcheck-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore base source
        shell: bash
        run: |
          mkdir -p /tmp/pc
          cat printcheck-build/source.b64.part* | base64 -d > /tmp/pc/source.zip
          unzip -q /tmp/pc/source.zip -d /tmp/pc

      - name: Rebuild 3.2.0-alpha2 base
        shell: bash
        run: |
          python3 printcheck-build/patch_alpha2.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha3.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha4.py /tmp/pc/printcheck_slim
          python3 printcheck-build/fix_alpha4_escape.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha5.py /tmp/pc/printcheck_slim
          cat printcheck-build/visual_overlay_3201.b64.part* | tr -d '\n\r' | base64 -d > /tmp/visual_overlay.tar.gz
          test "$(sha256sum /tmp/visual_overlay.tar.gz | awk '{print $1}')" = "f70406d03a0d282ef98cfc9342f20926097bd14a5163548cc90cd42522bbc455"
          tar -xzf /tmp/visual_overlay.tar.gz -C /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha3202.py /tmp/pc/printcheck_slim
          grep -q "versionName '3.2.0-alpha2'" /tmp/pc/printcheck_slim/app/build.gradle

      - name: Apply 3.3 preflight patch
        shell: bash
        run: |
          cat printcheck-build/pc330a1.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc330.patch.gz
          sha256sum /tmp/pc330.patch.gz
          test "$(sha256sum /tmp/pc330.patch.gz | awk '{print $1}')" = "43329662c53b7e117663da9ef83141110a0c0e1ba9aadfda51d080dea243a6ab"
          cd /tmp/pc/printcheck_slim
          set +e
          gzip -dc /tmp/pc330.patch.gz | patch --batch -p1
          PATCH_STATUS=$?
          set -e
          echo "patch exit status: $PATCH_STATUS"
          # README_RU.md and tests/run_core.sh are absent from the slim base and may be skipped.
          # The release gate below verifies every runtime file that must have been applied.

      - name: Verify 3.3.0-alpha1
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          grep -q "versionName '3.3.0-alpha1'" app/build.gradle
          grep -q "versionCode 330001" app/build.gradle
          test -f app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          test -f app/src/main/java/ru/printcheck/android/PreflightRules.java
          grep -q 'partial_v1' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'НАЛОЖЕНИЕ' app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'requirements_source' app/src/main/java/ru/printcheck/android/ReadOnlyHttp.java

      - name: Core tests
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          if [ -f tests/run_core.sh ]; then
            bash tests/run_core.sh
          else
            echo 'tests/run_core.sh is not present in slim base; Android compile verification will be used.'
          fi

      - name: Generate debug keystore
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          rm -f test-signing.keystore
          keytool -genkeypair -v \
            -keystore test-signing.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          cp /tmp/pc/printcheck_slim/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.3.0-alpha1.apk
          sha256sum PrintCheck_Android_3.3.0-alpha1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.3.0-alpha1_APK
          path: PrintCheck_Android_3.3.0-alpha1.apk
          if-no-files-found: error
          retention-days: 7
