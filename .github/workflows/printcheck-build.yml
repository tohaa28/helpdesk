name: Build PrintCheck 3.4.0-alpha6 APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha6
    paths:
      - 'printcheck-build/**'
      - '.github/workflows/printcheck-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore base source
        shell: bash
        run: |
          mkdir -p /tmp/pc
          cat printcheck-build/source.b64.part* | base64 -d > /tmp/pc/source.zip
          unzip -q /tmp/pc/source.zip -d /tmp/pc

      - name: Rebuild 3.2.0-alpha2 base
        shell: bash
        run: |
          python3 printcheck-build/patch_alpha2.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha3.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha4.py /tmp/pc/printcheck_slim
          python3 printcheck-build/fix_alpha4_escape.py /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha5.py /tmp/pc/printcheck_slim
          cat printcheck-build/visual_overlay_3201.b64.part* | tr -d '\n\r' | base64 -d > /tmp/visual_overlay.tar.gz
          test "$(sha256sum /tmp/visual_overlay.tar.gz | awk '{print $1}')" = "f70406d03a0d282ef98cfc9342f20926097bd14a5163548cc90cd42522bbc455"
          tar -xzf /tmp/visual_overlay.tar.gz -C /tmp/pc/printcheck_slim
          python3 printcheck-build/patch_alpha3202.py /tmp/pc/printcheck_slim

      - name: Apply 3.3.0-alpha1 preflight
        shell: bash
        run: |
          cat printcheck-build/pc330a1.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc330.patch.gz
          test "$(sha256sum /tmp/pc330.patch.gz | awk '{print $1}')" = "43329662c53b7e117663da9ef83141110a0c0e1ba9aadfda51d080dea243a6ab"
          cd /tmp/pc/printcheck_slim
          set +e
          gzip -dc /tmp/pc330.patch.gz | patch --batch -p1
          set -e

      - name: Apply 3.3.0-alpha2 surface-only patch
        shell: bash
        run: |
          cat printcheck-build/pc330a2.small* | tr -d '\n\r' | base64 -d > /tmp/pc330a2.patch.gz
          test "$(sha256sum /tmp/pc330a2.patch.gz | awk '{print $1}')" = "6879ea464c0f337c18d3aa66b776db5334de72dd64138026730c305543173931"
          cd /tmp/pc/printcheck_slim
          set +e
          gzip -dc /tmp/pc330a2.patch.gz | patch --batch -p1
          set -e

      - name: Overlay exact 3.4.0-alpha1 files
        shell: bash
        run: |
          cat printcheck-build/pc340_overlay.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340_overlay.tar.gz
          test "$(sha256sum /tmp/pc340_overlay.tar.gz | awk '{print $1}')" = "a98504f323bbaec0b9a02660f0b189b4a9cbf4bf1df46a7462fbcd6651b76336"
          tar -xzf /tmp/pc340_overlay.tar.gz -C /tmp/pc/printcheck_slim

      - name: Overlay exact 3.4.0-alpha2 files
        shell: bash
        run: |
          cat printcheck-build/pc340a2_overlay.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340a2_overlay.tar.gz
          test "$(sha256sum /tmp/pc340a2_overlay.tar.gz | awk '{print $1}')" = "c704f402ced8b8baa0b9d458d31be5d7c0f0100455bd2137e7d7d686fd691b22"
          tar -xzf /tmp/pc340a2_overlay.tar.gz -C /tmp/pc/printcheck_slim

      - name: Overlay exact 3.4.0-alpha3 files
        shell: bash
        run: |
          cat printcheck-build/pc340a3_overlay.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340a3_overlay.tar.gz
          sha256sum /tmp/pc340a3_overlay.tar.gz
          test "$(sha256sum /tmp/pc340a3_overlay.tar.gz | awk '{print $1}')" = "ecc424edefd4728b16c5c6a0a4fd1e9555c913201d2ef5226020785a42fd1794"
          tar -xzf /tmp/pc340a3_overlay.tar.gz -C /tmp/pc/printcheck_slim

      - name: Overlay exact 3.4.0-alpha4 files
        shell: bash
        run: |
          cat printcheck-build/pc340a4_overlay.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340a4_overlay.tar.gz
          sha256sum /tmp/pc340a4_overlay.tar.gz
          test "$(sha256sum /tmp/pc340a4_overlay.tar.gz | awk '{print $1}')" = "637f8fc2a2fb0351f3519d7443746027360cf753297d433d91ddef23144e6a6b"
          tar -xzf /tmp/pc340a4_overlay.tar.gz -C /tmp/pc/printcheck_slim

      - name: Apply 3.4.0-alpha5 PDF object preflight
        shell: bash
        run: |
          cat printcheck-build/pc340a5.patch.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340a5.patch.gz
          test "$(sha256sum /tmp/pc340a5.patch.gz | awk '{print $1}')" = "91336c1a5d50316cecd3ecf63e6a9747925809ae21b771f9ee00045f2402c8c5"
          cd /tmp/pc/printcheck_slim
          gzip -dc /tmp/pc340a5.patch.gz | patch --batch -p1
          rm -f app/src/main/java/ru/printcheck/android/NativeAuth.java
          rm -f app/src/main/java/ru/printcheck/android/LoginFormParser.java

      - name: Apply 3.4.0-alpha6 artwork-only font scope
        shell: bash
        run: |
          cat printcheck-build/pc340a6v2.patch.b64.part* | tr -d '\n\r' | base64 -d > /tmp/pc340a6.patch.gz
          sha256sum /tmp/pc340a6.patch.gz
          test "$(sha256sum /tmp/pc340a6.patch.gz | awk '{print $1}')" = "91eb2113864369c0daa4e61fd100f33af0eba26e16598e5a8d2edca24e92aced"
          cd /tmp/pc/printcheck_slim
          set +e
          gzip -dc /tmp/pc340a6.patch.gz | patch --batch -p2
          set -e
          rm -f PROGRESS.md.rej README_RU.md.rej
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Verify 3.4.0-alpha6
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          grep -q "versionName '3.4.0-alpha6'" app/build.gradle
          grep -q "versionCode 340006" app/build.gradle
          test -f app/src/main/java/ru/printcheck/android/PdfObjectInspector.java
          test ! -f app/src/main/java/ru/printcheck/android/NativeAuth.java
          test ! -f app/src/main/java/ru/printcheck/android/LoginFormParser.java
          grep -q 'fontsInArtwork' app/src/main/java/ru/printcheck/android/PdfObjectInspector.java
          grep -q 'private static String preflightOverall' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'private static PreflightRules.RuleSet rulesForItem' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'private static JSONObject rulesJson' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'has_live_text_global' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'font_scope' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Шрифты вне нанесения проигнорированы' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Живой текст в нанесении — макет недопустим' app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'fonts_scoped_to_artwork_v2' app/src/main/java/ru/printcheck/android/MainActivity.java

      - name: Core tests
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          bash tests/run_core.sh

      - name: Generate debug keystore
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          rm -f test-signing.keystore
          keytool -genkeypair -v \
            -keystore test-signing.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          cp /tmp/pc/printcheck_slim/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha6.apk
          sha256sum PrintCheck_Android_3.4.0-alpha6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha6_APK
          path: PrintCheck_Android_3.4.0-alpha6.apk
          if-no-files-found: error
          retention-days: 7
