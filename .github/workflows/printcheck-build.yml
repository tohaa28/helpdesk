name: Build PrintCheck APK

on:
  push:
    branches:
      - printcheck-build-3.1.0-alpha1
    paths:
      - 'printcheck-build/**'
      - '.github/workflows/printcheck-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore alpha1 source
        shell: bash
        run: |
          mkdir -p /tmp/pc
          cat printcheck-build/source.b64.part* | base64 -d > /tmp/pc/source.zip
          unzip -q /tmp/pc/source.zip -d /tmp/pc
      - name: Apply alpha2 network patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/pc/printcheck_slim')
          bg=root/'app/build.gradle'
          s=bg.read_text().replace('versionCode 300004','versionCode 300005').replace("versionName '3.1.0-alpha1'","versionName '3.1.0-alpha2'")
          bg.write_text(s)
          p=root/'app/src/main/java/ru/printcheck/android/ReadOnlyHttp.java'
          s=p.read_text()
          a=s.index('    String get(String url) throws Exception {')
          b=s.index('\n    private static byte[] readLimited',a)
          repl=r'''    String get(String url) throws Exception {
              IOException last = null;
              for (int attempt = 1; attempt <= 3; attempt++) {
                  try { return getOnce(url); }
                  catch (IOException e) {
                      last = e;
                      HttpURLConnection c = active; active = null;
                      if (c != null) c.disconnect();
                      if (!isRetryable(e) || attempt == 3) throw e;
                      try { Thread.sleep(350L * attempt); }
                      catch (InterruptedException ie) { Thread.currentThread().interrupt(); throw new IOException("Чтение остановлено", ie); }
                  }
              }
              throw last == null ? new IOException("Неизвестная ошибка HTTP") : last;
          }

          private String getOnce(String initialUrl) throws Exception {
              String url = initialUrl;
              for (int redirects = 0; redirects < 6; redirects++) {
                  assertReadOnly("GET", url);
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection(); active = c;
                  c.setRequestMethod("GET"); c.setInstanceFollowRedirects(false); c.setUseCaches(false);
                  c.setConnectTimeout(25000); c.setReadTimeout(45000);
                  c.setRequestProperty("User-Agent", userAgent);
                  c.setRequestProperty("Accept", "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8");
                  c.setRequestProperty("Accept-Language", "ru-RU,ru;q=0.9,en;q=0.5");
                  c.setRequestProperty("Connection", "close");
                  c.setRequestProperty("Accept-Encoding", "identity");
                  c.setRequestProperty("Cache-Control", "no-cache");
                  c.setRequestProperty("Pragma", "no-cache");
                  if (url.contains("/ajax/gifts/order?action=makets_popup")) {
                      c.setRequestProperty("X-Requested-With", "XMLHttpRequest");
                      c.setRequestProperty("Referer", "https://gifts.ru/private/");
                  }
                  String cookie = CookieManager.getInstance().getCookie(url);
                  if (cookie != null && !cookie.isEmpty()) c.setRequestProperty("Cookie", cookie);
                  int code = c.getResponseCode();
                  if (code >= 300 && code < 400) {
                      String next = c.getHeaderField("Location"); c.disconnect(); active = null;
                      if (next == null) throw new IOException("Перенаправление без адреса");
                      url = new URL(new URL(url), next).toString(); continue;
                  }
                  if (code != 200) { c.disconnect(); active = null; throw new IOException("HTTP " + code + " при чтении " + Safety.logUrl(url)); }
                  try (InputStream in = new BufferedInputStream(c.getInputStream(), 65536)) {
                      byte[] data = readLimited(in, HTML_LIMIT);
                      String text = new String(data, StandardCharsets.UTF_8);
                      c.disconnect(); active = null; return text;
                  } catch (IOException e) { c.disconnect(); active = null; throw e; }
              }
              throw new IOException("Слишком много перенаправлений");
          }

          private static boolean isRetryable(IOException e) {
              String m = String.valueOf(e.getMessage()).toLowerCase(Locale.ROOT);
              return m.contains("unexpected end of stream") || m.contains("end of stream") ||
                     m.contains("connection reset") || m.contains("connection closed") ||
                     m.contains("stream was reset") || m.contains("broken pipe") ||
                     m.contains("timeout") || m.contains("timed out");
          }
'''
          p.write_text(s[:a]+repl+s[b:])
          PY
      - name: Build
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          gradle --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        shell: bash
        run: |
          cp /tmp/pc/printcheck_slim/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.1.0-alpha2.apk
          sha256sum PrintCheck_Android_3.1.0-alpha2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.1.0-alpha2_APK
          path: PrintCheck_Android_3.1.0-alpha2.apk
          if-no-files-found: error
          retention-days: 7
