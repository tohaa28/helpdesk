name: Build PrintCheck APK

on:
  push:
    branches:
      - printcheck-build-3.2.0-alpha2
    paths:
      - 'printcheck-build/**'
      - '.github/workflows/printcheck-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore source
        shell: bash
        run: |
          mkdir -p /tmp/pc
          cat printcheck-build/source.b64.part* | base64 -d > /tmp/pc/source.zip
          unzip -q /tmp/pc/source.zip -d /tmp/pc
      - name: Apply alpha2 network patch
        run: python3 printcheck-build/patch_alpha2.py /tmp/pc/printcheck_slim
      - name: Apply alpha3 popup parser patch
        run: python3 printcheck-build/patch_alpha3.py /tmp/pc/printcheck_slim
      - name: Apply alpha4 exact-position patch
        run: python3 printcheck-build/patch_alpha4.py /tmp/pc/printcheck_slim
      - name: Fix alpha4 regex escape
        run: python3 printcheck-build/fix_alpha4_escape.py /tmp/pc/printcheck_slim
      - name: Apply alpha5 application-template patch
        run: python3 printcheck-build/patch_alpha5.py /tmp/pc/printcheck_slim
      - name: Overlay exact 3.2 visual files
        shell: bash
        run: |
          cat printcheck-build/visual_overlay_3201.b64.part* | tr -d '\n\r' | base64 -d > /tmp/visual_overlay.tar.gz
          test "$(sha256sum /tmp/visual_overlay.tar.gz | awk '{print $1}')" = "f70406d03a0d282ef98cfc9342f20926097bd14a5163548cc90cd42522bbc455"
          tar -xzf /tmp/visual_overlay.tar.gz -C /tmp/pc/printcheck_slim
      - name: Apply 3.2.0-alpha2 separation patch
        shell: bash
        run: |
          base64 -d printcheck-build/patch_3202.diff.gz.b64 | gzip -d > /tmp/patch_3202.diff
          cd /tmp/pc/printcheck_slim
          patch -p2 < /tmp/patch_3202.diff
      - name: Verify 3.2.0-alpha2
        shell: bash
        run: |
          grep -q "versionName '3.2.0-alpha2'" /tmp/pc/printcheck_slim/app/build.gradle
          grep -q 'versionCode 320002' /tmp/pc/printcheck_slim/app/build.gradle
          grep -q 'class ApplicationSeparator' /tmp/pc/printcheck_slim/app/src/main/java/ru/printcheck/android/ApplicationSeparator.java
          grep -q 'separation_file' /tmp/pc/printcheck_slim/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'application_name' /tmp/pc/printcheck_slim/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'ВЫДЕЛЕННОЕ НАНЕСЕНИЕ' /tmp/pc/printcheck_slim/app/src/main/java/ru/printcheck/android/ResultView.java
      - name: Core tests
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          if [ -f tests/run_core.sh ]; then
            bash tests/run_core.sh
          else
            echo 'tests/run_core.sh is not present in release overlay; compile/build verification will be used.'
          fi
      - name: Generate debug keystore
        shell: bash
        run: |
          cd /tmp/pc/printcheck_slim
          rm -f test-signing.keystore
          keytool -genkeypair -v             -keystore test-signing.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: |
          cd /tmp/pc/printcheck_slim
          gradle --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        run: |
          cp /tmp/pc/printcheck_slim/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.2.0-alpha2.apk
          sha256sum PrintCheck_Android_3.2.0-alpha2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.2.0-alpha2_APK
          path: PrintCheck_Android_3.2.0-alpha2.apk
          if-no-files-found: error
          retention-days: 7
