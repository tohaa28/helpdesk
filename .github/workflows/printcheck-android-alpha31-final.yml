name: Build PrintCheck 3.4.0-alpha31 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha31
    paths:
      - 'printcheck-build/ALPHA31_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha31-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare alpha31
        run: python3 printcheck-build/prepare_alpha31.py .
      - name: Verify alpha31 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha31'" .printcheck-alpha31/app/build.gradle
          grep -q "versionCode 340031" .printcheck-alpha31/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha31/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha31/app/build.gradle
          grep -q 'setAutoSizeTextTypeUniformWithConfiguration(7,9,1' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'title.setMaxLines(3)' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'cell.setOnClickListener(v->showCheckHint(a,c))' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'Что проверяется' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'Охранное поле — минимальное расстояние' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'strict_no_tolerance' .printcheck-alpha31/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
      - name: Alpha31 audit
        run: python3 .printcheck-alpha31/tests/audit_alpha31.py
      - name: Core tests
        run: bash .printcheck-alpha31/tests/run_core.sh
      - name: Build
        working-directory: .printcheck-alpha31
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha31/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha31_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha31_SIGNER.txt
      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha31/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha31.apk
          cd .printcheck-alpha31
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha31_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha31.apk PrintCheck_Android_3.4.0-alpha31_source.zip | tee PrintCheck_Android_3.4.0-alpha31_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha31_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha31.apk
            PrintCheck_Android_3.4.0-alpha31_source.zip
            PrintCheck_Android_3.4.0-alpha31_SHA256.txt
            PrintCheck_Android_3.4.0-alpha31_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
