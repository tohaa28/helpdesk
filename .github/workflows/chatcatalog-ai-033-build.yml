name: Build ChatCatalog AI 0.3.3

on:
  push:
    branches:
      - chatcatalog-ai-apk-0.3.3
    paths:
      - ".github/workflows/chatcatalog-ai-033-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct 0.3.3 source
        shell: bash
        run: |
          set -euo pipefail

          cat .chatcatalog-build-03/chunk_*.b64 | tr -d '\r\n' | base64 -d > /tmp/ChatCatalogAI-0.3.0-src.zip
          echo "0a2fbc8d94e9e47a06e615aa3747d7dcdd5414e1d861e905de3023caf2b220c1  /tmp/ChatCatalogAI-0.3.0-src.zip" | sha256sum -c -

          cat             .chatcatalog-patch-032/patch_00.b64             .chatcatalog-patch-032/patch_01.b64             .chatcatalog-patch-032/patch_02.b64             .chatcatalog-patch-032/patch_03.b64             | tr -d '\r\n' | base64 -d > /tmp/ChatCatalogAI-0.3.2-patch.zip
          echo "7a779c84e5d5ca505ccbe2b2ec203cd9e6ea1bf7507da68d3d815083f040365d  /tmp/ChatCatalogAI-0.3.2-patch.zip" | sha256sum -c -

          # Keep the split order explicit: shell collation can place patch_01a unexpectedly.
          cat \
            .chatcatalog-patch-033/patch_00.b64 \
            .chatcatalog-patch-033/patch_01.b64 \
            .chatcatalog-patch-033/patch_01a.b64 \
            .chatcatalog-patch-033/patch_02.b64 \
            .chatcatalog-patch-033/patch_03.b64 \
            .chatcatalog-patch-033/patch_04.b64 \
            | tr -d '\r\n' | base64 -d > /tmp/ChatCatalogAI-0.3.3-patch.zip
          echo "4cfca3e232df93977507a93fa0087290c412133cff467ee12e52e2760f6952d0  /tmp/ChatCatalogAI-0.3.3-patch.zip" | sha256sum -c -

          mkdir -p /tmp/chatcatalog033
          unzip -q /tmp/ChatCatalogAI-0.3.0-src.zip -d /tmp/chatcatalog033
          PROJECT=/tmp/chatcatalog033/ChatCatalogAI-0.3.0
          unzip -qo /tmp/ChatCatalogAI-0.3.2-patch.zip -d "$PROJECT"
          unzip -qo /tmp/ChatCatalogAI-0.3.3-patch.zip -d "$PROJECT"

          grep -q 'versionCode = 5' "$PROJECT/app/build.gradle.kts"
          grep -q 'versionName = "0.3.3"' "$PROJECT/app/build.gradle.kts"
          grep -q 'buildPublication' "$PROJECT/app/src/main/java/ru/chatcatalog/ai/publish/ImportedCatalogRenderer.kt"
          grep -q 'parseMode = "HTML"' "$PROJECT/app/src/main/java/ru/chatcatalog/ai/publish/CatalogPublisherClient.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: /tmp/chatcatalog033/ChatCatalogAI-0.3.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run tests
        working-directory: /tmp/chatcatalog033/ChatCatalogAI-0.3.0
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/chatcatalog033/ChatCatalogAI-0.3.0/app/build/outputs/apk/debug/app-debug.apk /tmp/ChatCatalogAI-0.3.3-unsigned-base.apk
          curl -L --fail --retry 3 https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o /tmp/uber-apk-signer-1.3.0.jar
          sha256sum /tmp/ChatCatalogAI-0.3.3-unsigned-base.apk /tmp/uber-apk-signer-1.3.0.jar

      - name: Upload build inputs
        uses: actions/upload-artifact@v4
        with:
          name: ChatCatalogAI-0.3.3-build-inputs
          path: |
            /tmp/ChatCatalogAI-0.3.3-unsigned-base.apk
            /tmp/uber-apk-signer-1.3.0.jar
          if-no-files-found: error
          retention-days: 7
