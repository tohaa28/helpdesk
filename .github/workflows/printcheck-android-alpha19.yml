name: Build PrintCheck 3.4.0-alpha19 APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha19
    paths-ignore:
      - '.ci/alpha19-result.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare canonical alpha19 source
        run: python3 printcheck-build/prepare_alpha19.py .

      - name: Verify alpha19 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha19'" .printcheck-alpha19/app/build.gradle
          grep -q "versionCode 340019" .printcheck-alpha19/app/build.gradle
          grep -q "MIN_COLOR_HIGHLIGHT_SCORE" .printcheck-alpha19/app/src/main/java/ru/printcheck/android/ConstructorFieldLogic.java
          grep -q "preserved-colored-field" .printcheck-alpha19/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "field_highlight_rgb" .printcheck-alpha19/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          test -f .printcheck-alpha19/app/src/main/java/ru/printcheck/android/ConstructorVectorInspector.java
          test -f .printcheck-alpha19/app/src/main/java/ru/printcheck/android/ConstructorFieldLogic.java
          test ! -f .printcheck-alpha19/app/src/main/java/ru/printcheck/android/ApplicationFieldMapper.java
          ! grep -R "analyzeMappedField" .printcheck-alpha19/app/src/main/java/ru/printcheck/android

      - name: Alpha19 regression audit
        run: python3 .printcheck-alpha19/tests/audit_alpha19.py

      - name: Core tests
        run: bash .printcheck-alpha19/tests/run_core.sh

      - name: Build APK
        working-directory: .printcheck-alpha19
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Package source
        shell: bash
        run: |
          cd .printcheck-alpha19
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha19_source.zip" . -x '*/build/*' '*.keystore'

      - name: Collect APK and hashes
        shell: bash
        run: |
          cp .printcheck-alpha19/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha19.apk
          sha256sum PrintCheck_Android_3.4.0-alpha19.apk PrintCheck_Android_3.4.0-alpha19_source.zip | tee PrintCheck_Android_3.4.0-alpha19_SHA256.txt

      - name: Upload alpha19 build
        uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha19_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha19.apk
            PrintCheck_Android_3.4.0-alpha19_source.zip
            PrintCheck_Android_3.4.0-alpha19_SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record CI result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci
          {
            echo "version=3.4.0-alpha19"
            echo "source_commit=$GITHUB_SHA"
            echo "status=$RESULT"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > .ci/alpha19-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/alpha19-result.txt
          git diff --cached --quiet || git commit -m "Record alpha19 CI result [skip ci]"
          git push
