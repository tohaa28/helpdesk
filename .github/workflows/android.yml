name: Build PrintCheck 3.4.0-alpha9 APK
on: [workflow_dispatch, push]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare canonical alpha9 source
        run: python3 printcheck-build/prepare_alpha9.py .
      - name: Core tests
        run: bash .printcheck-alpha9/tests/run_core.sh
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        shell: bash
        run: |
          cp .printcheck-alpha9/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha9.apk
          sha256sum PrintCheck_Android_3.4.0-alpha9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha9_BUILD
          path: PrintCheck_Android_3.4.0-alpha9.apk
          if-no-files-found: error
          retention-days: 7
