name: Build PrintCheck 3.4.0-alpha11 APK
on: [workflow_dispatch, push]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare canonical alpha11 source
        run: python3 printcheck-build/prepare_alpha11.py .
      - name: Verify alpha11
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha11'" .printcheck-alpha11/app/build.gradle
          grep -q "versionCode 340011" .printcheck-alpha11/app/build.gradle
          grep -q "same_page_mask_registration_v1" .printcheck-alpha11/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "constructor_aux_filter_v1" .printcheck-alpha11/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "conditional_rules_v1" .printcheck-alpha11/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "same-page-mask-inclusion" .printcheck-alpha11/app/src/main/java/ru/printcheck/android/RasterMatcher.java
          grep -q "isAuxiliaryConstructorPdf" .printcheck-alpha11/app/src/main/java/ru/printcheck/android/ReadOnlyHttp.java
      - name: Core tests
        run: bash .printcheck-alpha11/tests/run_core.sh
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package source
        shell: bash
        run: |
          cd .printcheck-alpha11
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha11_source.zip" . -x '*/build/*' '*.keystore'
      - name: Collect APK
        shell: bash
        run: |
          cp .printcheck-alpha11/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha11.apk
          sha256sum PrintCheck_Android_3.4.0-alpha11.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha11_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha11.apk
            PrintCheck_Android_3.4.0-alpha11_source.zip
          if-no-files-found: error
          retention-days: 7
