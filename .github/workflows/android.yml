name: Build PrintCheck 3.4.0-alpha15 APK
on: [workflow_dispatch, push]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare canonical alpha15 source
        run: python3 printcheck-build/prepare_alpha15.py .
      - name: Verify alpha15 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha15'" .printcheck-alpha15/app/build.gradle
          grep -q "versionCode 340015" .printcheck-alpha15/app/build.gradle
          grep -q "alpha7_application_geometry_v1" .printcheck-alpha15/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'geometry_reference_type","application' .printcheck-alpha15/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "Геометрия по общему конструктору запрещена" .printcheck-alpha15/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "suppressProductionBoundary(hi,target)" .printcheck-alpha15/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
      - name: Alpha15 regression audit
        run: python3 .printcheck-alpha15/tests/audit_alpha15.py
      - name: Core tests
        run: bash .printcheck-alpha15/tests/run_core.sh
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package source
        shell: bash
        run: |
          cd .printcheck-alpha15
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha15_source.zip" . -x '*/build/*' '*.keystore'
      - name: Collect APK
        shell: bash
        run: |
          cp .printcheck-alpha15/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha15.apk
          sha256sum PrintCheck_Android_3.4.0-alpha15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha15_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha15.apk
            PrintCheck_Android_3.4.0-alpha15_source.zip
          if-no-files-found: error
          retention-days: 7
