name: Build PrintCheck 3.4.0-alpha21 FINAL2 signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha21
    paths:
      - 'printcheck-build/ALPHA21_FINAL2_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha21-final2
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha21
        run: python3 printcheck-build/prepare_alpha21.py .

      - name: Verify source invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha21'" .printcheck-alpha21/app/build.gradle
          grep -q "versionCode 340021" .printcheck-alpha21/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha21/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha21/app/build.gradle
          grep -q "selected_application_template_primary_v3" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "local_field_registration_v1" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "ArtworkDiffLogic.isAdded" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "artwork_file" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "Theme_Black_NoTitleBar_Fullscreen" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q "onDoubleTap" .printcheck-alpha21/app/src/main/java/ru/printcheck/android/ZoomImageView.java

      - name: Audit
        run: python3 .printcheck-alpha21/tests/audit_alpha21.py

      - name: Core tests
        run: bash .printcheck-alpha21/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha21
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify signer
        shell: bash
        run: |
          APK=.printcheck-alpha21/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha21_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha21_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha21/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha21.apk
          cd .printcheck-alpha21
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha21_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha21.apk PrintCheck_Android_3.4.0-alpha21_source.zip | tee PrintCheck_Android_3.4.0-alpha21_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha21_FINAL2_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha21.apk
            PrintCheck_Android_3.4.0-alpha21_source.zip
            PrintCheck_Android_3.4.0-alpha21_SHA256.txt
            PrintCheck_Android_3.4.0-alpha21_SIGNER.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record final2 result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci
          {
            echo "version=3.4.0-alpha21"
            echo "source_commit=$GITHUB_SHA"
            echo "status=$RESULT"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > .ci/alpha21-final2-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/alpha21-final2-result.txt
          git diff --cached --quiet || git commit -m "Record alpha21 final2 CI result [skip ci]"
          git pull --rebase origin printcheck-build-3.4.0-alpha21
          git push
