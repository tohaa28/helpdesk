name: Build PrintCheck 3.4.0-alpha42 FINAL signed APK
on:
  push:
    branches: [printcheck-build-3.4.0-alpha42]
    paths: ['printcheck-build/ALPHA42_FINAL_TRIGGER.txt']
  workflow_dispatch:
concurrency:
  group: printcheck-alpha42-final
  cancel-in-progress: true
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prepare alpha42
        run: python3 printcheck-build/prepare_alpha42.py .
      - name: Verify alpha42 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha42'" .printcheck-alpha42/app/build.gradle
          grep -q 'ПАРАМЕТРЫ НАНЕСЕНИЯ' .printcheck-alpha42/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'ПОЛЕ ПО КОНСТРУКТОРУ' .printcheck-alpha42/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'НАЙДЕННОЕ НАНЕСЕНИЕ' .printcheck-alpha42/app/src/main/java/ru/printcheck/android/ResultView.java
      - name: Alpha42 audit
        run: python3 .printcheck-alpha42/tests/audit_alpha42.py
      - name: Core tests
        run: bash .printcheck-alpha42/tests/run_core.sh
      - name: Build
        working-directory: .printcheck-alpha42
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha42/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha42_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha42_SIGNER.txt
      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha42/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha42.apk
          cd .printcheck-alpha42
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha42_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha42.apk PrintCheck_Android_3.4.0-alpha42_source.zip | tee PrintCheck_Android_3.4.0-alpha42_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha42_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha42.apk
            PrintCheck_Android_3.4.0-alpha42_source.zip
            PrintCheck_Android_3.4.0-alpha42_SHA256.txt
            PrintCheck_Android_3.4.0-alpha42_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
