name: Build PrintCheck 3.4.0-alpha28 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha28
    paths:
      - 'printcheck-build/ALPHA28_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha28-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha28
        run: python3 printcheck-build/prepare_alpha28.py .

      - name: Verify alpha28 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha28'" .printcheck-alpha28/app/build.gradle
          grep -q "versionCode 340028" .printcheck-alpha28/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha28/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha28/app/build.gradle
          grep -q 'brandLine.setOrientation(LinearLayout.HORIZONTAL)' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'TextView version=text(BuildConfig.VERSION_NAME,10)' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Заказы ожидающие проверку' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'class TreeToggle' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'treeNode(a,"Краткий чеклист"' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'treeNode(a,"Подробный чеклист"' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'populateDetailedChecklist' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'if(show&&firstOpen!=null&&!n.loaded)' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'rule_diameter_circles_v7_no_center_dot_reference_ruler' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q 'per-color-medial-gap-v2-intersection-safe' .printcheck-alpha28/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java

      - name: Alpha28 audit
        run: python3 .printcheck-alpha28/tests/audit_alpha28.py

      - name: Core tests
        run: bash .printcheck-alpha28/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha28
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha28/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha28_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha28_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha28/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha28.apk
          cd .printcheck-alpha28
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha28_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha28.apk PrintCheck_Android_3.4.0-alpha28_source.zip | tee PrintCheck_Android_3.4.0-alpha28_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha28_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha28.apk
            PrintCheck_Android_3.4.0-alpha28_source.zip
            PrintCheck_Android_3.4.0-alpha28_SHA256.txt
            PrintCheck_Android_3.4.0-alpha28_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
