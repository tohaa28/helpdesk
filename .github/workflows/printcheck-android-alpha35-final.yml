name: Build PrintCheck 3.4.0-alpha35 FINAL signed APK
on:
  push:
    branches: [printcheck-build-3.4.0-alpha35]
    paths: ['printcheck-build/ALPHA35_FINAL_TRIGGER.txt']
  workflow_dispatch:
concurrency:
  group: printcheck-alpha35-final
  cancel-in-progress: true
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prepare alpha35
        run: python3 printcheck-build/prepare_alpha35.py .
      - name: Verify alpha35 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha35'" .printcheck-alpha35/app/build.gradle
          grep -q "versionCode 340035" .printcheck-alpha35/app/build.gradle
          grep -q 'android:name=".QuickCheckActivity"' .printcheck-alpha35/app/src/main/AndroidManifest.xml
          grep -q 'Быстрая проверка PDF' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Получить конструктор на Gifts' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/QuickCheckActivity.java
          grep -q 'ConstructorVectorInspector.inspectAll' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/QuickCheckActivity.java
          grep -q 'TechnologyCheckMatrix.add(checks,rules)' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/QuickCheckEngine.java
          grep -q 'constructor_product_color' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/MainActivity.java
          ! grep -q 'w.heading("Техническая информация")' .printcheck-alpha35/app/src/main/java/ru/printcheck/android/PdfReportWriter.java
      - name: Alpha35 audit
        run: python3 .printcheck-alpha35/tests/audit_alpha35.py
      - name: Core tests
        run: bash .printcheck-alpha35/tests/run_core.sh
      - name: Build
        working-directory: .printcheck-alpha35
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha35/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha35_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha35_SIGNER.txt
      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha35/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha35.apk
          cd .printcheck-alpha35
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha35_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha35.apk PrintCheck_Android_3.4.0-alpha35_source.zip | tee PrintCheck_Android_3.4.0-alpha35_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha35_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha35.apk
            PrintCheck_Android_3.4.0-alpha35_source.zip
            PrintCheck_Android_3.4.0-alpha35_SHA256.txt
            PrintCheck_Android_3.4.0-alpha35_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
