name: Build PrintCheck 3.4.0-alpha29 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha29
    paths:
      - 'printcheck-build/ALPHA29_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha29-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha29
        run: python3 printcheck-build/prepare_alpha29.py .

      - name: Verify alpha29 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha29'" .printcheck-alpha29/app/build.gradle
          grep -q "versionCode 340029" .printcheck-alpha29/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha29/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha29/app/build.gradle
          grep -q 'TextView title=text("PrintCheck",22)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'TextView version=text(BuildConfig.VERSION_NAME,9)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'TextView readOnly=text("read-only",9)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/MainActivity.java
          ! grep -q 'безопасная проверка read-only' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Заказы ожидающие проверку' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'treeNode(a,"Заказ №"+result.optString("order"),meta,0,null,expanded)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'for(int i=0;i<checks.length();i+=2)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'briefCheckCell' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'populateBriefArtwork' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'largeEvidence(a,f,240)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'bindTree(articleNode,false,loadArticle)' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'rule_diameter_circles_v7_no_center_dot_reference_ruler' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q 'per-color-medial-gap-v2-intersection-safe' .printcheck-alpha29/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java

      - name: Alpha29 audit
        run: python3 .printcheck-alpha29/tests/audit_alpha29.py

      - name: Core tests
        run: bash .printcheck-alpha29/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha29
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha29/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha29_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha29_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha29/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha29.apk
          cd .printcheck-alpha29
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha29_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha29.apk PrintCheck_Android_3.4.0-alpha29_source.zip | tee PrintCheck_Android_3.4.0-alpha29_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha29_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha29.apk
            PrintCheck_Android_3.4.0-alpha29_source.zip
            PrintCheck_Android_3.4.0-alpha29_SHA256.txt
            PrintCheck_Android_3.4.0-alpha29_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
