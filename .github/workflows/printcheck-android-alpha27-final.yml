name: Build PrintCheck 3.4.0-alpha27 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha27
    paths:
      - 'printcheck-build/ALPHA27_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha27-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha27
        run: python3 printcheck-build/prepare_alpha27.py .

      - name: Verify alpha27 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha27'" .printcheck-alpha27/app/build.gradle
          grep -q "versionCode 340027" .printcheck-alpha27/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha27/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha27/app/build.gradle
          test -f .printcheck-alpha27/app/src/main/java/ru/printcheck/android/MarkerSizeLogic.java
          grep -q "per-color-medial-gap-v2-intersection-safe" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "distanceToOtherColour" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "negativeSameColor" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/SmallElementAnalyzer.java
          grep -q "centered_issue_markers_v2_rule_diameter_no_center_dot" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "rule_diameter_circles_v7_no_center_dot_reference_ruler" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "marker_diameter_mode" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "marker_diameter_mm" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "marker_center_symbol" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "MarkerSizeLogic.diameterPx(feature.ruleMm,pxPerMm,scale)" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          ! grep -q "float radius=18f" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "ARTWORK_TARGET_DPI = 720" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "MAX_ARTWORK_PIXELS = 4_000_000L" .printcheck-alpha27/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java

      - name: Alpha27 audit
        run: python3 .printcheck-alpha27/tests/audit_alpha27.py

      - name: Core tests
        run: bash .printcheck-alpha27/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha27
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha27/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha27_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha27_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha27/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha27.apk
          cd .printcheck-alpha27
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha27_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha27.apk PrintCheck_Android_3.4.0-alpha27_source.zip | tee PrintCheck_Android_3.4.0-alpha27_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha27_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha27.apk
            PrintCheck_Android_3.4.0-alpha27_source.zip
            PrintCheck_Android_3.4.0-alpha27_SHA256.txt
            PrintCheck_Android_3.4.0-alpha27_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
