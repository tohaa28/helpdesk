name: Build PrintCheck 3.4.0-alpha30 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha30
    paths:
      - 'printcheck-build/ALPHA30_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha30-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare alpha30
        run: python3 printcheck-build/prepare_alpha30.py .
      - name: Verify alpha30 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha30'" .printcheck-alpha30/app/build.gradle
          grep -q "versionCode 340030" .printcheck-alpha30/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha30/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha30/app/build.gradle
          grep -q 'significant-artwork-to-real-field-edge-v1' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/GuardFieldLogic.java
          grep -q 'strict_no_tolerance' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q 'right_in_field_mm' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q 'bottom_in_field_mm' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q 'Охранное поле соблюдено' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Охранное поле нарушено' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'Автоматическая проверка вылета выполняется отдельно от охранного поля' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q 'for(int i=0;i<checks.length();i+=2)' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/ResultView.java
          grep -q 'rule_diameter_circles_v7_no_center_dot_reference_ruler' .printcheck-alpha30/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
      - name: Alpha30 audit
        run: python3 .printcheck-alpha30/tests/audit_alpha30.py
      - name: Core tests
        run: bash .printcheck-alpha30/tests/run_core.sh
      - name: Build
        working-directory: .printcheck-alpha30
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify persistent signer
        shell: bash
        run: |
          APK=.printcheck-alpha30/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha30_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha30_SIGNER.txt
      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha30/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha30.apk
          cd .printcheck-alpha30
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha30_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha30.apk PrintCheck_Android_3.4.0-alpha30_source.zip | tee PrintCheck_Android_3.4.0-alpha30_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha30_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha30.apk
            PrintCheck_Android_3.4.0-alpha30_source.zip
            PrintCheck_Android_3.4.0-alpha30_SHA256.txt
            PrintCheck_Android_3.4.0-alpha30_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
