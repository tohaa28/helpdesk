name: Build PrintCheck 3.4.0-alpha22 FINAL signed APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha22
    paths:
      - 'printcheck-build/ALPHA22_FINAL_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: printcheck-alpha22-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare alpha22
        run: python3 printcheck-build/prepare_alpha22.py .

      - name: Verify source invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha22'" .printcheck-alpha22/app/build.gradle
          grep -q "versionCode 340022" .printcheck-alpha22/app/build.gradle
          grep -q "applicationId 'ru.printcheck.android'" .printcheck-alpha22/app/build.gradle
          grep -q "alphaPersistent" .printcheck-alpha22/app/build.gradle
          grep -q "highres_artwork_roi_v1" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "ARTWORK_TARGET_DPI = 900" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "ARTWORK_MIN_DPI = 300" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "MAX_ARTWORK_PIXELS = 8_000_000L" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "artwork_analysis_dpi" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "layout-minus-selected-template-v4-highres-roi-background-aware" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "saveArtworkEvidence(hi.layout,hi.layoutField,hi.art,mask)" .printcheck-alpha22/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          test -f .printcheck-alpha22/app/src/main/java/ru/printcheck/android/AnalysisResolutionLogic.java
          test ! -f .printcheck-alpha22/app/src/main/java/ru/printcheck/android/ApplicationFieldMapper.java

      - name: Alpha22 audit
        run: python3 .printcheck-alpha22/tests/audit_alpha22.py

      - name: Core tests
        run: bash .printcheck-alpha22/tests/run_core.sh

      - name: Build
        working-directory: .printcheck-alpha22
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify signer
        shell: bash
        run: |
          APK=.printcheck-alpha22/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee PrintCheck_Android_3.4.0-alpha22_SIGNER.txt
          grep -qi "822540c7386d193fd3dec165620398572306a20b2640b8769181597766a45d11" PrintCheck_Android_3.4.0-alpha22_SIGNER.txt

      - name: Package
        shell: bash
        run: |
          cp .printcheck-alpha22/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha22.apk
          cd .printcheck-alpha22
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha22_source.zip" . -x '*/build/*' '*.keystore' '*.p12'
          cd "$GITHUB_WORKSPACE"
          sha256sum PrintCheck_Android_3.4.0-alpha22.apk PrintCheck_Android_3.4.0-alpha22_source.zip | tee PrintCheck_Android_3.4.0-alpha22_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha22_FINAL_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha22.apk
            PrintCheck_Android_3.4.0-alpha22_source.zip
            PrintCheck_Android_3.4.0-alpha22_SHA256.txt
            PrintCheck_Android_3.4.0-alpha22_SIGNER.txt
          if-no-files-found: error
          retention-days: 7
