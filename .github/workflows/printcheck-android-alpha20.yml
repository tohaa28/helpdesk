name: Build PrintCheck 3.4.0-alpha20 APK

on:
  push:
    branches:
      - printcheck-build-3.4.0-alpha20
    paths-ignore:
      - '.ci/alpha20-result.txt'
      - 'printcheck-build/PRINTCHECK_HANDOFF.md'
      - 'printcheck-build/DEVELOPMENT_LOG.md'
      - 'printcheck-build/ALPHA20_MANIFEST.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare canonical alpha20 source
        run: python3 printcheck-build/prepare_alpha20.py .

      - name: Verify alpha20 invariants
        shell: bash
        run: |
          grep -q "versionName '3.4.0-alpha20'" .printcheck-alpha20/app/build.gradle
          grep -q "versionCode 340020" .printcheck-alpha20/app/build.gradle
          grep -q "selected_application_template_primary_v2" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "alphaPersistent" .printcheck-alpha20/app/build.gradle
          test -f .printcheck-alpha20/signing/printcheck-alpha-test.p12
          grep -q "recoverAlignmentFromApplicationField" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/MainActivity.java
          grep -q "selectedFieldIdentitySizeMm" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/PartialTemplateLogic.java
          grep -q "SOURCE_APPLICATION_RASTER" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/ConstructorFieldLogic.java
          grep -q "matchesReferenceNeighborhood" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "drawArtworkMask" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          grep -q "analyzeApplicationField" .printcheck-alpha20/app/src/main/java/ru/printcheck/android/GeometryAnalyzer.java
          test -f .printcheck-alpha20/app/src/main/java/ru/printcheck/android/ConstructorVectorInspector.java
          test ! -f .printcheck-alpha20/app/src/main/java/ru/printcheck/android/ApplicationFieldMapper.java
          ! grep -R "analyzeMappedField" .printcheck-alpha20/app/src/main/java/ru/printcheck/android

      - name: Alpha20 regression audit
        run: python3 .printcheck-alpha20/tests/audit_alpha20.py

      - name: Core tests
        run: bash .printcheck-alpha20/tests/run_core.sh

      - name: Build APK
        working-directory: .printcheck-alpha20
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Package source
        shell: bash
        run: |
          cd .printcheck-alpha20
          zip -qr "$GITHUB_WORKSPACE/PrintCheck_Android_3.4.0-alpha20_source.zip" . -x '*/build/*' '*.keystore' '*.p12'

      - name: Collect APK and hashes
        shell: bash
        run: |
          cp .printcheck-alpha20/app/build/outputs/apk/debug/app-debug.apk PrintCheck_Android_3.4.0-alpha20.apk
          sha256sum PrintCheck_Android_3.4.0-alpha20.apk PrintCheck_Android_3.4.0-alpha20_source.zip | tee PrintCheck_Android_3.4.0-alpha20_SHA256.txt

      - name: Upload alpha20 build
        uses: actions/upload-artifact@v4
        with:
          name: PrintCheck_Android_3.4.0-alpha20_BUILD
          path: |
            PrintCheck_Android_3.4.0-alpha20.apk
            PrintCheck_Android_3.4.0-alpha20_source.zip
            PrintCheck_Android_3.4.0-alpha20_SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record CI result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci
          {
            echo "version=3.4.0-alpha20"
            echo "source_commit=$GITHUB_SHA"
            echo "status=$RESULT"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > .ci/alpha20-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/alpha20-result.txt
          git diff --cached --quiet || git commit -m "Record alpha20 CI result [skip ci]"
          git push
